name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cosmocite .
      - name: Start the container and wait until it is ready
        run: |
          docker run -d --name app -p 8000:8000 cosmocite
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health | grep -q true && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8000/api/health | grep -q true
          curl -sf http://127.0.0.1:8000/ | grep -q CosmoCite
          curl -sf -X POST http://127.0.0.1:8000/api/ask -H "Content-Type: application/json" -d '{"question": "How does microgravity affect bone in mice?"}' | grep -q '"sufficient":true'
